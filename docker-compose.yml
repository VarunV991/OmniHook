services:
  omnihook:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Named volume (docker-owned): always writable by the nonroot image user.
      # Bind mounts (./data:/data) fail on Linux unless the host dir is
      # writable by UID 65532: mkdir -p data && sudo chown -R 65532:65532 data
      - omnihook-data:/data
    environment:
      BIND: "0.0.0.0" # container loopback != host loopback; keep, gate with token
      PORT: "8080"
      DATA_DIR: /data
      RETENTION_HOURS: "168"
      ACCESS_TOKEN: "changeme" # exposed port: set a real secret
      # PUBLIC_URL: https://your-tunnel.trycloudflare.com
    extra_hosts:
      # Lets forward/replay targets reach apps on the host:
      # target http://host.docker.internal:3000/... (Linux needs this mapping)
      - "host.docker.internal:host-gateway"
  # Example in-compose forward target (always reachable as http://echo:3000):
  echo:
    image: hashicorp/http-echo
    command: ["-listen=:3000", "-text=ok"]

volumes:
  omnihook-data:
