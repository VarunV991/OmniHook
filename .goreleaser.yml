version: 2
project_name: omnihook
builds:
  - main: ./cmd/omnihook
    binary: omnihook
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
snapshot:
  version_template: "{{ .Version }}-next"
