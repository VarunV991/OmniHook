<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OmniHook — local webhook inbox</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b0f14;color:#e6edf3}
header{padding:12px 16px;border-bottom:1px solid #222;font-weight:700}
main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 49px)}
#list{border-right:1px solid #222;overflow:auto}
#detail{padding:16px;overflow:auto}
.item{padding:10px 12px;border-bottom:1px solid #1a2230;cursor:pointer}
.item:hover{background:#111a26}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin-left:8px}
.pass{background:#0f5132}.fail{background:#842029}.skip{background:#444}
pre{background:#111a26;padding:12px;border-radius:8px;overflow:auto}
button{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
input,select,textarea{width:100%;padding:8px;margin:4px 0;border-radius:6px;border:1px solid #333;background:#0f1520;color:#e6edf3}
.hint{background:#2a1a05;border:1px solid #6b4a00;padding:10px;border-radius:8px;margin:10px 0}
code{color:#9ecbff}
</style>
</head>
<body>
<header>OmniHook <span style="font-weight:400;color:#8b949e">capture · verify · replay — <code id="health">…</code></span></header>
<main>
<div id="list"><div style="padding:12px">
<button onclick="newEndpoint()">+ New endpoint</button>
<div id="items"></div></div></div>
<div id="detail"><h3>Select a request</h3>
<p>Create an endpoint, point your provider at <code>/hook/&lt;slug&gt;</code>, then replay to localhost unlimited times.</p>
<div id="d"></div></div>
</main>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function authHeaders(){const t=localStorage.getItem('omnihook_token');return t?{'Authorization':'Bearer '+t}:{};}
async function api(p,o){
  o=o||{};o.headers=Object.assign({},o.headers||{},authHeaders());
  let r=await fetch(p,o);
  if(r.status===401){const t=prompt('Access token (ACCESS_TOKEN):');if(t){localStorage.setItem('omnihook_token',t);o.headers=Object.assign({},o.headers,{'Authorization':'Bearer '+t});r=await fetch(p,o);}}
  if(!r.ok){throw new Error(await r.text());}
  return r.json();
}
async function refresh(){
  const eps=await api('/api/endpoints');
  const box=document.getElementById('items');box.innerHTML='';
  for(const e of eps){
    const reqs=await api(`/api/endpoints/${e.slug}/requests?limit=20`);
    const h=document.createElement('div');h.innerHTML=`<b>${esc(e.slug)}</b> <span style="color:#8b949e">${esc(e.provider||'generic')}</span>`;
    box.appendChild(h);
    for(const q of reqs){
      const d=document.createElement('div');d.className='item';
      const cls=q.verify_status==='PASS'?'pass':q.verify_status==='FAIL'?'fail':'skip';
      d.innerHTML=`<code>${esc(q.method)}</code> ${esc(q.path)} <span class="badge ${cls}">${esc(q.verify_status)}</span><br/><small style="color:#8b949e">${esc(q.id.slice(0,8))} · ${esc(q.received_at)}</small>`;
      d.onclick=()=>show(q.id);
      box.appendChild(d);
    }
  }
}
async function show(id){
  const q=await api('/api/requests/'+id);
  document.getElementById('d').innerHTML=
   `<h3><code>${esc(q.method)}</code> ${esc(q.path)} <span class="badge">${esc(q.verify_status)}</span></h3>`+
   (q.fix_hint?`<div class="hint"><b>Fix:</b> ${esc(q.fix_hint)}</div>`:'')+
   `<h4>Headers</h4><pre>${esc(JSON.stringify(JSON.parse(q.headers||'{}'),null,2))}</pre>`+
   `<h4>Body</h4><pre>${esc((q.body_text||'').slice(0,20000))}</pre>`+
   `<h4>Replay</h4><input id="t" value="http://localhost:3000/webhooks/stripe" placeholder="target localhost URL"/>`+
   `<div><label>times <input id="tn" type="number" value="1" min="1" max="50" style="width:80px"/></label> `+
   `<label><input id="rs" type="checkbox"/> re-sign (refresh timestamps with endpoint secret)</label></div>`+
   `<button onclick="replay('${q.id}')">Replay</button><pre id="rout"></pre>`;
}
async function replay(id){
  const target=document.getElementById('t').value;
  const times=Math.min(50,Math.max(1,parseInt(document.getElementById('tn').value||'1',10)));
  const resign=document.getElementById('rs').checked;
  const r=await api('/api/requests/'+id+'/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target,times,resign})});
  document.getElementById('rout').textContent=JSON.stringify(r,null,2);
}
async function newEndpoint(){
  const slug=prompt('slug? (letters, digits, -, _)','proj1');if(!slug)return;
  try{await api('/api/endpoints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug})});}
  catch(e){alert('Create failed: '+e.message);return;}
  refresh();
}
fetch('/health').then(r=>r.json()).then(j=>document.getElementById('health').textContent='db:'+j.db+' v'+j.version).catch(()=>{});
refresh().catch(()=>{});setInterval(()=>refresh().catch(()=>{}),3000);
</script>
</body>
</html>
