<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OmniHook — local webhook inbox</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b0f14;color:#e6edf3}
header{padding:12px 16px;border-bottom:1px solid #222;font-weight:700}
main{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);min-height:calc(100vh - 49px)}
#list{border-right:1px solid #222;overflow:auto;min-width:0}
#detail{padding:16px;overflow:auto}
.item{display:block;width:100%;box-sizing:border-box;text-align:left;color:inherit;font:inherit;padding:10px 12px;border:0;border-bottom:1px solid #1a2230;background:transparent;cursor:pointer}
.item:hover{background:#111a26}.item[aria-current="true"]{background:#16263b;outline:2px solid #1f6feb;outline-offset:-2px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin-left:8px}
.pass{background:#0f5132}.fail{background:#842029}.skip{background:#444}
pre{background:#111a26;padding:12px;border-radius:8px;overflow:auto}
button{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
input,select,textarea{box-sizing:border-box;width:100%;padding:8px;margin:4px 0;border-radius:6px;border:1px solid #333;background:#0f1520;color:#e6edf3}
.hint{background:#2a1a05;border:1px solid #6b4a00;padding:10px;border-radius:8px;margin:10px 0}
code{color:#9ecbff}label{display:block;margin:6px 0}.status{padding:10px 12px;color:#8b949e}.error{background:#3b1118;border:1px solid #842029;color:#ffb4bd;padding:10px 12px;border-radius:8px;margin:10px 12px}@media(max-width:640px){main{display:flex;flex-direction:column}.list-panel{max-height:48vh;border-right:0;border-bottom:1px solid #222}#detail{padding:12px}}
</style>
</head>
<body>
<header>OmniHook <span style="font-weight:400;color:#8b949e">capture · verify · replay — <code id="health">…</code></span></header>
<main>
<div id="list" class="list-panel"><div style="padding:12px">
<details open><summary><b>+ New endpoint</b></summary>
<div style="margin-top:8px">
<label for="ns">Slug</label><input id="ns" placeholder="letters, digits, -, _"/>
<label for="np">Provider</label><select id="np"><option value="generic">generic</option><option value="auto">auto</option><option value="stripe">stripe</option><option value="github">github</option><option value="standard">standard</option><option value="razorpay">razorpay</option><option value="shopify">shopify</option></select>
<label for="nsec">Signing secret</label><input id="nsec" type="password" placeholder="optional"/>
<label for="nt">Forward target</label><input id="nt" placeholder="http://localhost:3000/hook (optional)"/>
<button onclick="newEndpoint()">Create</button>
</div></details>
<div id="items"></div></div></div>
<div id="detail"><h3>Select a request</h3>
<p>Create an endpoint, point your provider at <code>/hook/&lt;slug&gt;</code>, then replay to localhost unlimited times.</p>
<div id="d"></div></div>
</main>
<script>let refreshInFlight=null, refreshAgain=false, selectedId='', streams=new Map(), olderRequests=[], olderCursor='', nextInboxCursor='', paginationStarted=false, detailSeq=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function authHeaders(){const t=localStorage.getItem('omnihook_token');return t?{'Authorization':'Bearer '+t}:{};}
function showError(host,msg,retry){host.innerHTML='<div class="error" role="alert">'+esc(msg)+(retry?' <button type="button" data-retry>Retry</button>':'')+'</div>';const b=host.querySelector('[data-retry]');if(b)b.onclick=retry;}
async function api(p,o){o=o||{};o.headers=Object.assign({},o.headers||{},authHeaders());let r=await fetch(p,o);if(r.status===401){const t=prompt('Access token (ACCESS_TOKEN):');if(t){localStorage.setItem('omnihook_token',t);o.headers=Object.assign({},o.headers,{'Authorization':'Bearer '+t});r=await fetch(p,o);}}if(!r.ok){let m=await r.text();try{m=JSON.parse(m).error||m;}catch(_){}throw new Error(m||('HTTP '+r.status));}return r.json();}
function connectStream(slug){if(streams.has(slug)||!window.EventSource||localStorage.getItem('omnihook_token'))return;const es=new EventSource('/api/endpoints/'+encodeURIComponent(slug)+'/stream');es.addEventListener('ready',()=>refresh());es.addEventListener('request',()=>refresh());es.onopen=()=>refresh();es.onerror=()=>{es.close();streams.delete(slug);};streams.set(slug,es);}
async function refresh(){if(refreshInFlight){refreshAgain=true;return refreshInFlight;}const box=document.getElementById('items');refreshInFlight=(async()=>{const [eps,page]=await Promise.all([api('/api/endpoints'),api('/api/requests?limit=100')]);const groups=new Map();if(!paginationStarted)nextInboxCursor=page.next_cursor||'';for(const q of (page.requests||[]).concat(olderRequests)){if(!groups.has(q.endpoint))groups.set(q.endpoint,[]);groups.get(q.endpoint).push(q);}box.innerHTML='';for(const e of eps){const curl=location.origin+'/hook/'+e.slug;const h=document.createElement('div');h.innerHTML='<b>'+esc(e.slug)+'</b> <span style="color:#8b949e">'+esc(e.provider||'generic')+'</span><br/><small><code>'+esc(curl)+'</code> <button type="button" class="copy">copy</button> '+(e.target_url?' → <code>'+esc(e.target_url)+'</code> ':'')+'<button type="button" class="delete">delete</button></small>';box.appendChild(h);h.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(curl);h.querySelector('.copy').textContent='copied';}catch(_){showError(box,'Copy failed; select the URL manually.');}};h.querySelector('.delete').onclick=()=>delEndpoint(e.slug);for(const q of groups.get(e.slug)||[]){const d=document.createElement('button');d.type='button';d.className='item';d.setAttribute('aria-current',q.id===selectedId?'true':'false');const cls=q.verify_status==='PASS'?'pass':q.verify_status==='FAIL'?'fail':'skip';d.innerHTML='<code>'+esc(q.method)+'</code> '+esc(q.path)+' <span class="badge '+cls+'">'+esc(q.verify_status)+'</span><br/><small style="color:#8b949e">'+esc(q.id.slice(0,8))+' · '+esc(q.received_at)+'</small>';d.onclick=()=>show(q.id,e.target_url||'',d);box.appendChild(d);}connectStream(e.slug);}if(nextInboxCursor){const more=document.createElement('button');more.type='button';more.textContent='Load older requests';more.onclick=()=>loadOlder(nextInboxCursor);box.appendChild(more);}if(!box.children.length)box.innerHTML='<div class="status">No captured requests yet.</div>';})().catch(e=>showError(box,'Inbox refresh failed: '+e.message,refresh));try{await refreshInFlight;}finally{refreshInFlight=null;if(refreshAgain){refreshAgain=false;return refresh();}}}
async function loadOlder(cursor){try{const page=await api('/api/requests?limit=100&cursor='+encodeURIComponent(cursor));paginationStarted=true;const seen=new Set(olderRequests.map(q=>q.id));olderRequests=olderRequests.concat((page.requests||[]).filter(q=>!seen.has(q.id)));olderCursor=page.next_cursor||'';nextInboxCursor=olderCursor;await refresh();}catch(e){showError(document.getElementById('items'),'Loading older requests failed: '+e.message,()=>loadOlder(cursor));}}
async function delEndpoint(slug){if(!confirm('Delete endpoint '+slug+' and its requests?'))return;try{await api('/api/endpoints/'+encodeURIComponent(slug),{method:'DELETE'});if(streams.has(slug)){streams.get(slug).close();streams.delete(slug);}await refresh();}catch(e){showError(document.getElementById('items'),'Delete failed: '+e.message,refresh);}}
async function show(id,defTarget,button){const seq=++detailSeq;const detail=document.getElementById('d');selectedId=id;document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current','false'));if(button){button.setAttribute('aria-current','true');button.focus();}detail.innerHTML='<div class="status" role="status">Loading request…</div>';try{const [q,reps]=await Promise.all([api('/api/requests/'+encodeURIComponent(id)),api('/api/requests/'+encodeURIComponent(id)+'/replays')]);if(seq!==detailSeq)return;detail.innerHTML='<h3><code>'+esc(q.method)+'</code> '+esc(q.path)+' <span class="badge">'+esc(q.verify_status)+'</span></h3>'+(q.verify_error?'<div class="hint"><b>Verify:</b> '+esc(q.verify_error)+'</div>':'')+(q.fix_hint?'<div class="hint"><b>Fix:</b> '+esc(q.fix_hint)+'</div>':'')+'<h4>Headers</h4><pre>'+esc(JSON.stringify(JSON.parse(q.headers||'{}'),null,2))+'</pre><h4>Body</h4><pre>'+esc((q.body_text||'').slice(0,20000))+'</pre><h4>Delivery attempts ('+reps.length+')</h4><pre>'+esc(reps.map(r=>r.created_at+' → '+r.target_url+' '+r.status_code+' '+r.latency_ms+'ms '+(r.error||'')).join('\n')||'none yet')+'</pre><h4>Replay</h4><label for="t">Target URL</label><input id="t" value="'+esc(defTarget||'http://localhost:3000/webhooks/stripe')+'" placeholder="target localhost URL"/><label for="tn">Times</label><input id="tn" type="number" value="1" min="1" max="50" style="width:80px"/><label><input id="rs" type="checkbox"/> re-sign (refresh timestamps with endpoint secret)</label><button type="button" id="replay-btn" onclick="replay(\''+esc(q.id)+'\')">Replay</button><pre id="rout" role="status"></pre>';}catch(e){showError(detail,'Request load failed: '+e.message,()=>show(id,defTarget,button));}}
async function replay(id){const out=document.getElementById('rout'),btn=document.getElementById('replay-btn');if(!btn)return;btn.disabled=true;out.textContent='Replaying…';try{const r=await api('/api/requests/'+encodeURIComponent(id)+'/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:document.getElementById('t').value,times:Math.min(50,Math.max(1,parseInt(document.getElementById('tn').value||'1',10))),resign:document.getElementById('rs').checked})});out.textContent=JSON.stringify(r,null,2);}catch(e){out.textContent='Replay failed: '+e.message;out.setAttribute('role','alert');}finally{btn.disabled=false;}}
async function newEndpoint(){const slug=document.getElementById('ns').value.trim(),provider=document.getElementById('np').value,secret=document.getElementById('nsec').value,target=document.getElementById('nt').value.trim();if(!slug){showError(document.getElementById('items'),'Slug is required.');return;}try{await api('/api/endpoints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,provider,secret,target_url:target})});}catch(e){showError(document.getElementById('items'),'Create failed: '+e.message,refresh);return;}document.getElementById('ns').value='';document.getElementById('nsec').value='';document.getElementById('nt').value='';await refresh();}
async function health(){try{const j=await api('/health');document.getElementById('health').textContent='db:'+j.db+' v'+j.version;}catch(e){document.getElementById('health').textContent='offline';document.getElementById('health').setAttribute('title',e.message);}}
health();refresh();setInterval(refresh,10000);</script>
</body>
</html>
